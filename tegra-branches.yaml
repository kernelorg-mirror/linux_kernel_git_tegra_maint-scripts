# git repository remotes
remotes:
  origin:
    pull: git://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
  next:
    pull: git://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git
  tegra:
    push: git@gitolite.kernel.org:pub/scm/linux/kernel/git/tegra/linux.git
    pull: git://git.kernel.org/pub/scm/linux/kernel/git/tegra/linux.git
  github:
    push: git@github.com:thierryreding/linux.git

# subsystem trees
targets:
  arm-soc:
    tag-prefix: tegra-
    to:
      - arm@kernel.org
      - soc@kernel.org
    cc:
      - Thierry Reding <thierry.reding@gmail.com>
      - Jon Hunter <jonathanh@nvidia.com>
      - linux-tegra@vger.kernel.org
      - linux-arm-kernel@lists.infradead.org
    addressee: ARM SoC maintainers
  clk:
    to:
      - Michael Turquette <mturquette@baylibre.com>
      - Stephen Boyd <sboyd@kernel.org>
    cc:
      - linux-clk@vger.kernel.org
      - linux-tegra@vger.kernel.org
    addressee: Mike, Stephen
  regulator:
    to:
      - Liam Girdwood <lgirdwood@gmail.com>
      - Mark Brown <broonie@kernel.org>
    cc:
      - linux-kernel@vger.kernel.org
  cpuidle:
    to:
      - Rafael J. Wysocki <rjw@rjwysocki.net>
      - Daniel Lezcano <daniel.lezcano@linaro.org>
    cc:
      - linux-pm@vger.kernel.org
      - linux-tegra@vger.kernel.org
    addressee: Rafael, Daniel
  i2c:
    to:
      - Wolfram Sang <wsa@the-dreams.de>
    cc:
      - linux-i2c@vger.kernel.org
      - linux-tegra@vger.kernel.org
  usb:
    to:
      - Greg Kroah-Hartman <gregkh@linuxfoundation.org>
      - Felipe Balbi <balbi@kernel.org>
    cc:
      - linux-usb@vger.kernel.org
      - linux-tegra@vger.kernel.org
    addressee: Greg, Felipe
  phy:
    to:
      - Kishon Vijay Abraham I <kishon@ti.com>
      - Vinod Koul <vkoul@kernel.org>
    cc:
      - linux-phy@lists.infradead.org
    addressee: Kishon, Vinod

# local branches
branches:
  for-next:
    remote: tegra
    dependencies:
      v5.15-rc1:
        remote: origin

      for-5.16/clk:
        remote: tegra
        target: clk
        dependencies:
          v5.15-rc1:
            remote: origin

      for-5.16/dt-bindings:
        remote: tegra
        target: arm-soc
        dependencies:
          v5.15-rc1:
            remote: origin

      for-5.16/firmware:
        remote: tegra
        target: arm-soc
        dependencies:
          v5.15-rc1:
            remote: origin

      for-5.16/soc:
        remote: tegra
        target: arm-soc
        dependencies:
          v5.15-rc1:
            remote: origin

      for-5.16/cpuidle:
        remote: tegra
        target: arm-soc
        dependencies:
          v5.15-rc1:
            remote: origin
          for-5.16/clk:
            remote: tegra
          for-5.16/soc:
            remote: tegra

      for-5.16/arm/dt:
        remote: tegra
        target: arm-soc
        dependencies:
          v5.15-rc1:
            remote: origin

      for-5.16/arm64/dt:
        remote: tegra
        target: arm-soc
        dependencies:
          v5.15-rc1:
            remote: origin

      for-5.16/arm64/defconfig:
        remote: tegra
        target: arm-soc
        dependencies:
          v5.15-rc1:
            remote: origin

#  for-5.7/work:
#    remote: github
#    dependencies:
#      master:
#        remote: next

builds:
  arm:
    tegra_defconfig:
      branches:
        remotes:
          - tegra
    multi_v7_defconfig:
      branches:
        remotes:
          - tegra
  arm64:
    defconfig:
      branches:
        remotes:
          - tegra

